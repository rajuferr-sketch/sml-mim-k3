name: "11 - CodeQL & Dependency Security Audit"
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dependencies Vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
